server.port=8080
spring.main.allow-bean-definition-overriding=true
spring.kafka.bootstrap-servers=localhost:29092

consumer.topic=stream-company-psc
consumer.group_id=psc-search-consumer
consumer.max_attempts=5
consumer.backoff_delay=100
consumer.concurrency=1

invalid_message_topic=${consumer.topic}-${consumer.group_id}-invalid

logger.namespace=psc-search-consumer

steps=1
psc.consumer.enabled=true

